about:
  eyebrow: Est. New York
  title: Our story
  studio_eyebrow: The studio
  studio_title: Heavyweight pieces, made in small batches in the city we love.
  studio_p1: Stamped started with a single tee and a simple idea — make the kind of New York staple you actually want to keep — heavyweight, honest, and built to age well. No fast fashion, no endless drops. Just a tight collection of pieces we wear ourselves.
  studio_p2: Everything is designed in our studio and screen-printed by hand in limited runs. We garment-dye for that lived-in feel, double-stitch the seams that matter, and keep the prints soft so they never crack. When a run sells out, it's gone — and we move on to the next.
  pillar1_title: Made here
  pillar1_copy: Designed and printed in New York, in runs small enough to check every piece by hand.
  pillar2_title: Built to last
  pillar2_copy: Heavyweight, garment-dyed cotton that softens with wear instead of falling apart.
  pillar3_title: Kept honest
  pillar3_copy: Fair prices, no markdown games, and a tight collection we genuinely stand behind.
  city_title: From the city, for the city
  city_copy: Our pieces are photographed where we wear them — the waterfront, the park, the upper deck, the late train home. That's the whole point — clothes for the everyday city, not the runway.
  city_cta: See the lookbook

