faq:
  eyebrow: Good to know
  title: FAQ
  q1: How do your pieces fit?
  a1: Our tees are cut boxy and relaxed — if you prefer a classic fit, size down one. Hoodies are oversized with dropped shoulders. Each product page lists the exact fit and fabric weight.
  q2: When will my order ship?
  a2: In-stock orders ship within two business days from New York. You'll get a tracking link by email as soon as it's on its way.
  q3: Do you ship internationally?
  a3: Yes. International shipping is calculated at checkout. Duties and taxes may be collected by your local carrier on delivery.
  q4: What's your return policy?
  a4: Unworn, unwashed items can be returned within 30 days for a refund or exchange. Start a return from your account or by emailing us.
  q5: How should I care for my pieces?
  a5: Machine wash cold inside-out, hang or tumble dry low. Skip the iron on the print. Our heavyweight cotton is pre-shrunk, so it holds its shape.
  q6: Will sold-out pieces come back?
  a6: Sometimes. We make in small batches, so popular pieces restock occasionally — join the list to hear first.
  cta_title: Still have a question?
  cta_copy: We're happy to help with sizing, orders, and anything else.
  cta_button: Contact us

