policies:
  label: Policies
  sample_note: Sample policy copy for this demo storefront.
  shipping_title: Shipping
  shipping_h1: Processing
  shipping_p1: In-stock orders are packed and shipped from New York within two business days. You'll receive a confirmation email with tracking as soon as your order is on its way.
  shipping_h2: Domestic (U.S.)
  shipping_p2: Standard shipping is a flat $6, and free on orders over $85 — typically 3–5 business days. Express delivery (1–2 business days) is available at checkout.
  shipping_h3: International
  shipping_p3: We ship worldwide. Rates are calculated at checkout based on destination and weight. Any duties or import taxes are the responsibility of the recipient and may be collected on delivery.
  shipping_h4: Lost or delayed packages
  shipping_p4_prefix: If your tracking hasn't updated in several days, reach out via
  shipping_p4_link: our contact page
  shipping_p4_suffix: and we'll chase it down with the carrier.
  returns_title: Returns & exchanges
  returns_h1: 30-day window
  returns_p1: Unworn, unwashed items with tags attached can be returned within 30 days of delivery for a refund to the original payment method, or exchanged for a different size.
  returns_h2: How to start a return
  returns_p2: Sign in to your account and open the order, or email us with your order number. We'll send a prepaid label for U.S. returns; international return shipping is the customer's responsibility.
  returns_h3: Refunds
  returns_p3: Once your return is received and inspected, refunds are issued within 3–5 business days. It can take a few extra days for your bank to post the credit.
  returns_h4: Final sale
  returns_p4: Limited-edition and clearly marked final-sale pieces can't be returned or exchanged. The product page will always say so before you buy.
  terms_title: Terms & conditions
  terms_h1: Overview
  terms_p1: By using this site and placing an order, you agree to these terms. We may update them from time to time; the version posted here is the one that applies to your order.
  terms_h2: Orders & pricing
  terms_p2: All prices are listed in U.S. dollars. We reserve the right to correct pricing errors and to limit quantities. An order is confirmed once you receive a confirmation email.
  terms_h3: Products
  terms_p3: Because our pieces are garment-dyed and printed in small batches, slight variation between items is normal and part of the character — it is not a defect.
  terms_h4: Intellectual property
  terms_p4: All artwork, designs, and content on this site belong to Stamped and may not be reproduced without permission.
  terms_h5: Contact
  terms_p5_prefix: Questions about these terms? Reach us through
  terms_p5_link: our contact page
  privacy_title: Privacy
  privacy_h1: What we collect
  privacy_p1: We collect the details you give us to fulfill an order — name, shipping address, email, and payment confirmation — plus basic, privacy-friendly analytics about how the site is used.
  privacy_h2: How we use it
  privacy_p2: Your information is used to process orders, provide support, and — only if you opt in — send occasional updates about new releases. We never sell your data.
  privacy_h3: Payments
  privacy_p3: Card details are handled by our payment processor and are never stored on our servers.
  privacy_h4: Your choices
  privacy_p4_prefix: You can unsubscribe from email at any time, and you may request a copy or deletion of your data by contacting us through
  privacy_p4_link: our contact page
