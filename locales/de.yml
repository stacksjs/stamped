about:
  eyebrow: Gegründet in New York
  title: Unsere Geschichte
  studio_eyebrow: Das Studio
  studio_title: Schwere Teile, in kleinen Mengen gefertigt — in der Stadt, die wir lieben.
  studio_p1: Stamped begann mit einem einzigen T-Shirt und einer einfachen Idee — ein New-York-Basic zu machen, das man wirklich behalten will — schwer, ehrlich und gemacht, um gut zu altern. Keine Fast Fashion, keine endlosen Drops. Nur eine kleine Kollektion von Teilen, die wir selbst tragen.
  studio_p2: Alles wird in unserem Studio entworfen und in limitierten Auflagen von Hand bedruckt. Wir stückfärben für das eingetragene Gefühl, doppelnähen die Nähte, auf die es ankommt, und halten die Prints weich, damit sie nie reißen. Wenn eine Auflage ausverkauft ist, ist sie weg — und wir machen mit der nächsten weiter.
  pillar1_title: Hier gemacht
  pillar1_copy: In New York entworfen und gedruckt, in Auflagen klein genug, um jedes Teil von Hand zu prüfen.
  pillar2_title: Für die Ewigkeit gemacht
  pillar2_copy: Schwere, stückgefärbte Baumwolle, die mit dem Tragen weicher wird, statt zu zerfallen.
  pillar3_title: Ehrlich gehalten
  pillar3_copy: Faire Preise, keine Rabattspielchen und eine kleine Kollektion, hinter der wir wirklich stehen.
  city_title: Aus der Stadt, für die Stadt
  city_copy: Unsere Teile werden dort fotografiert, wo wir sie tragen — am Wasser, im Park, auf der Tribüne, im letzten Zug nach Hause. Genau darum geht es — Kleidung für den Alltag in der Stadt, nicht für den Laufsteg.
  city_cta: Zum Lookbook

