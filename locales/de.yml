faq:
  eyebrow: Gut zu wissen
  title: Häufige Fragen
  q1: Wie fallen eure Teile aus?
  a1: Unsere T-Shirts sind boxy und locker geschnitten — wenn du eine klassische Passform bevorzugst, wähle eine Nummer kleiner. Hoodies sind oversized mit fallenden Schultern. Jede Produktseite nennt die genaue Passform und das Stoffgewicht.
  q2: Wann wird meine Bestellung versendet?
  a2: Vorrätige Bestellungen werden innerhalb von zwei Werktagen aus New York versendet. Du erhältst einen Tracking-Link per E-Mail, sobald sie unterwegs ist.
  q3: Versendet ihr international?
  a3: Ja. Der internationale Versand wird an der Kasse berechnet. Zölle und Steuern können bei der Lieferung von deinem lokalen Versanddienstleister erhoben werden.
  q4: Wie ist eure Rückgaberichtlinie?
  a4: Ungetragene, ungewaschene Artikel können innerhalb von 30 Tagen für eine Rückerstattung oder einen Umtausch zurückgegeben werden. Starte eine Rückgabe über dein Konto oder per E-Mail.
  q5: Wie pflege ich meine Teile?
  a5: Auf links bei kalt waschen, hängend trocknen oder im Trockner bei niedriger Stufe. Den Print nicht bügeln. Unsere schwere Baumwolle ist vorgewaschen und behält ihre Form.
  q6: Kommen ausverkaufte Teile zurück?
  a6: Manchmal. Wir fertigen in kleinen Mengen, daher werden beliebte Teile gelegentlich nachproduziert — trag dich in die Liste ein, um es zuerst zu erfahren.
  cta_title: Noch eine Frage?
  cta_copy: Wir helfen gern bei Größen, Bestellungen und allem anderen.
  cta_button: Kontaktiere uns

