policies:
  label: Richtlinien
  sample_note: Beispiel-Richtlinientext für diesen Demo-Shop.
  shipping_title: Versand
  shipping_h1: Bearbeitung
  shipping_p1: Vorrätige Bestellungen werden innerhalb von zwei Werktagen aus New York verpackt und versendet. Du erhältst eine Bestätigungs-E-Mail mit Sendungsverfolgung, sobald deine Bestellung unterwegs ist.
  shipping_h2: Inland (USA)
  shipping_p2: Der Standardversand kostet pauschal $6 und ist ab $85 kostenlos — in der Regel 3–5 Werktage. Expressversand (1–2 Werktage) ist an der Kasse verfügbar.
  shipping_h3: International
  shipping_p3: Wir versenden weltweit. Die Versandkosten werden an der Kasse je nach Ziel und Gewicht berechnet. Etwaige Zölle oder Einfuhrsteuern trägt der Empfänger und können bei der Lieferung erhoben werden.
  shipping_h4: Verlorene oder verspätete Pakete
  shipping_p4_prefix: Wenn deine Sendungsverfolgung mehrere Tage lang nicht aktualisiert wurde, melde dich über
  shipping_p4_link: unsere Kontaktseite
  shipping_p4_suffix: und wir gehen der Sache beim Versanddienstleister nach.
  returns_title: Rückgabe & Umtausch
  returns_h1: 30-Tage-Frist
  returns_p1: Ungetragene, ungewaschene Artikel mit angehängten Etiketten können innerhalb von 30 Tagen nach Lieferung für eine Rückerstattung auf das ursprüngliche Zahlungsmittel zurückgegeben oder gegen eine andere Größe umgetauscht werden.
  returns_h2: So startest du eine Rückgabe
  returns_p2: Melde dich in deinem Konto an und öffne die Bestellung oder schreib uns mit deiner Bestellnummer. Für US-Rückgaben senden wir ein vorfrankiertes Etikett; die internationale Rücksendung trägt der Kunde.
  returns_h3: Rückerstattungen
  returns_p3: Sobald deine Rückgabe eingegangen und geprüft ist, erfolgt die Rückerstattung innerhalb von 3–5 Werktagen. Es kann einige Tage länger dauern, bis deine Bank die Gutschrift verbucht.
  returns_h4: Endgültiger Verkauf
  returns_p4: Limitierte und klar als Final Sale gekennzeichnete Teile können nicht zurückgegeben oder umgetauscht werden. Die Produktseite weist immer vor dem Kauf darauf hin.
  terms_title: Allgemeine Geschäftsbedingungen
  terms_h1: Überblick
  terms_p1: Durch die Nutzung dieser Website und die Aufgabe einer Bestellung stimmst du diesen Bedingungen zu. Wir können sie von Zeit zu Zeit aktualisieren; es gilt die hier veröffentlichte Version für deine Bestellung.
  terms_h2: Bestellungen & Preise
  terms_p2: Alle Preise sind in US-Dollar angegeben. Wir behalten uns das Recht vor, Preisfehler zu korrigieren und Mengen zu begrenzen. Eine Bestellung ist bestätigt, sobald du eine Bestätigungs-E-Mail erhältst.
  terms_h3: Produkte
  terms_p3: Da unsere Teile stückgefärbt und in kleinen Mengen gedruckt werden, sind leichte Abweichungen zwischen den Artikeln normal und Teil des Charakters — kein Mangel.
  terms_h4: Geistiges Eigentum
  terms_p4: Alle Grafiken, Designs und Inhalte auf dieser Website gehören Stamped und dürfen ohne Genehmigung nicht reproduziert werden.
  terms_h5: Kontakt
  terms_p5_prefix: Fragen zu diesen Bedingungen? Erreiche uns über
  terms_p5_link: unsere Kontaktseite
  privacy_title: Datenschutz
  privacy_h1: Was wir erfassen
  privacy_p1: Wir erfassen die Angaben, die du uns zur Abwicklung einer Bestellung machst — Name, Lieferadresse, E-Mail und Zahlungsbestätigung — sowie grundlegende, datenschutzfreundliche Analysen zur Nutzung der Website.
  privacy_h2: Wie wir sie verwenden
  privacy_p2: Deine Daten werden verwendet, um Bestellungen zu bearbeiten, Support zu leisten und — nur mit deiner Zustimmung — gelegentlich Neuigkeiten über neue Releases zu senden. Wir verkaufen deine Daten niemals.
  privacy_h3: Zahlungen
  privacy_p3: Kartendaten werden von unserem Zahlungsdienstleister verarbeitet und niemals auf unseren Servern gespeichert.
  privacy_h4: Deine Wahlmöglichkeiten
  privacy_p4_prefix: Du kannst dich jederzeit von E-Mails abmelden und eine Kopie oder Löschung deiner Daten anfordern, indem du uns über
  privacy_p4_link: unsere Kontaktseite

